.dim{color:#5a5a50;font-size:16px}
.x{position:absolute;right:10px;top:12px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(29,26,20,.5);font-size:18px;display:grid;place-items:center}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;margin:6px 0;background:rgba(29,26,20,.07);border-radius:8px;border:1px solid rgba(29,26,20,.2)}

.row.ok{background:rgba(70,140,70,.16)}
.back{padding:6px 0;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:#6a4a10}
.big{display:block;width:100%;margin-top:12px;padding:15px;background:#1d1a14;color:var(--tape);font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:6px;font-size:16px;text-align:center}

.bar{height:16px;border-radius:8px;background:rgba(29,26,20,.18);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:#c9871a}
.ev{display:grid;justify-items:center;gap:4px;margin:8px 0}
.ev canvas,.pc canvas{border:2px solid #1d1a14;border-radius:6px}
.pgrid,.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc,.sc{display:grid;justify-items:center;gap:4px;padding:8px;background:rgba(29,26,20,.07);border:2px solid transparent;border-radius:8px;text-align:center}
.sc canvas{border-radius:6px;width:72px;height:72px}

.sc.on{border-color:#1d1a14;background:rgba(242,194,48,.3)}
.pc.bad{border-color:#b02a2a}
.pc span{font-weight:700}
.vrow{display:flex;gap:12px;align-items:center;margin:6px 0}
.vrow canvas{border-radius:8px;flex:none}
.vrow small{display:block;font-size:15px;color:#4a4a40}

.opt{text-align:left;padding:10px;border:1.5px solid rgba(29,26,20,.4);border-radius:8px;font-size:16px}

.stack{margin-top:auto;display:grid;gap:10px}
.tb{display:block;width:100%;padding:16px;border-radius:6px;font-family:var(--disp);font-size:24px;letter-spacing:.08em;text-transform:uppercase;text-align:left;border:1.5px solid var(--line);background:var(--glass)}

  else if(e.tool==='dust'){g.fillStyle='rgba(235,240,245,.55)';for(let k=0;k<5;k++){g.beginPath();g.ellipse(x+Math.sin(k*2)*7,y+Math.cos(k*3)*6,10-k,6,k,0,TAU);g.fill()}g.strokeStyle='rgba(40,50,60,.55)';g.lineWidth=1;for(let k=-2;k<=2;k++){g.beginPath();g.arc(x,y,5+k*2.2+3,.2,2.9);g.stroke()}}
  else{const gr=g.createRadialGradient(x,y,0,x,y,30);gr.addColorStop(0,'rgba(220,190,255,'+p+')');gr.addColorStop(.5,'rgba(150,90,255,'+.5*p+')');gr.addColorStop(1,'rgba(120,60,255,0)');g.fillStyle=gr;g.fillRect(x-32,y-32,64,64)}
  g.restore()});
 // darkness
 g.setTransform(dpr,0,0,dpr,0,0);const lx=(L.x-camX)*scale,ly=(L.y-camY)*scale,rr_=R*scale;

const LIN=['Dr. Lin','Det. Reyes'];

 P.notes.push({h:'Scene',t:'#'+e.no+' '+e.name+' found in the '+roomOf(e)+'. '+e.desc});toast('Evidence #'+e.no+': '+e.name+'. '+quips[e.id]);$('bLab').classList.add('pulse')}

/* lab */
function resultOf(e){

  case 'weapon':case 'mug':return 'Partial print on the '+e.name.toLowerCase()+' matches '+sus(e.who).name+'.';
  case 'shoe':return 'Size '+C.facts.shoe+' footwear, deep tread, worn left heel. Cast taken.';
  case 'blood':return 'Blood type '+C.facts.blood+'. Not the victim\'s. Someone cut themselves badly.';
  case 'fiber':return 'Dyed '+C.facts.fiber[1]+' wool, consistent with a '+C.facts.fiber[0]+'.';
  case 'watch':return 'Stopped at '+T0()+'. That is your time of death.';
  case 'glow':return 'Bioluminescent plankton, a species not native to this coast. Source unknown. Dr. Lin would like a word with the ocean.';}}

const VALID=['weapon','shoe','blood','fiber'];
function verdict(){const ok=pickS===C.cu,mot=pickM===C.cu,ev=pickE.filter(x=>VALID.includes(x)).length;
 if(!ok){P.tries++;tone(120,.6,.1,'sawtooth');if(P.tries>=2){shut('acc');ending(0)}else{$('accB').innerHTML='';$('accB').appendChild(el('h3',null,'The case collapses'));$('accB').appendChild(el('p',null,esc(sus(pickS).name)+' walks, and the real culprit hears about it. Chief Okafor wants you to look at the clue matrix again. One attempt left.'));const r=el('button','big','Back to the case');r.onclick=()=>shut('acc');$('accB').appendChild(r)}return}
 let stars=1;if(mot&&ev===2)stars=3;else if(mot||ev===2)stars=2;if(P.hints>2||P.mistakes>3)stars=Math.max(1,stars-(stars===3?1:0));if(P.cracked&&stars<3&&mot)stars=Math.min(3,stars+0);
 shut('acc');ending(stars)}
const RANKS=['Cold Case','Rookie','Investigator','Chief Inspector'];
function ending(stars){P.end=true;if(stars)saveRec(C.seed,stars);const c=sus(C.cu);
 $('resS').textContent=stars?'★'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆';$('resR').textContent=RANKS[stars];
 const rec=stars?esc(c.name)+' ('+esc(c.role)+') killed '+esc(C.V)+' at '+T0()+' pm with the '+esc(C.weapon[0].toLowerCase())+'. '+esc(c.motive)+' They left a print on the weapon, a size '+C.facts.shoe+' boot print, a smear of '+C.facts.blood+' blood, and wool fibres from a '+esc(C.facts.fiber[0])+'. They lied about being at '+esc(c.alibiPlace)+', and '+esc(sus(C.w).name)+' saw them heading for the '+esc(C.bodyRoom)+'.'
   :'You ran out of attempts. The killer was '+esc(c.name)+', the '+esc(c.role.toLowerCase())+'. '+esc(c.motive)+' The print on the '+esc(C.weapon[0].toLowerCase())+' was theirs all along.';
 $('resB').innerHTML='<p>'+rec+'</p><p class="uc">Dr. Lin’s plankton samples were still glowing at dawn. The tide chart says the sea has not reached '+esc(C.loc)+' in thirty years. Nobody writes that in the report.</p><p class="dim">Time '+clockTxt()+' · hints '+P.hints+' · lab mistakes '+P.mistakes+(P.cracked?' · confession obtained':'')+'</p>';open('res')}

/* menus */
function brief(){const b=$('briefB');b.innerHTML='';const hd=el('div','vrow');const vc=document.createElement('canvas');vc.width=vc.height=84;avatar(vc,hash(C.V),'#555',true);hd.appendChild(vc);
 hd.appendChild(el('span',null,'<small class="mono">CASE '+caseNo(C.seed)+'</small><b>'+esc(C.V)+'</b><small>'+esc(C.vrole)+', found dead</small>'));b.appendChild(hd);
 b.appendChild(el('p',null,'Found at <b>'+C.found+' pm</b> in the <b>'+esc(C.bodyRoom)+'</b> of '+esc(C.tp.tag)+' by '+esc(C.finder)+'. Dr. Lin puts death between <b>10:00 and 11:00 pm</b>. Four people were on the premises tonight.'));
 const g2=el('div','sgrid');C.S.forEach(s=>{const x=el('div','sc');const c=document.createElement('canvas');c.width=c.height=72;avatar(c,s.seed,s.ward[2]);x.appendChild(c);x.appendChild(el('b',null,esc(s.name)));x.appendChild(el('small',null,esc(s.role)));g2.appendChild(x)});b.appendChild(g2);
 b.appendChild(el('p','dim','Sweep the dark scene with your light. Switch to powder for prints and UV for stains. Collect, analyze, question, arrest.'))}
function start(seed){newGame(seed);started=true;$('title').hidden=true;$('scene').hidden=false;layout();camX=300;camY=300;renderTray();document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('on',x.dataset.t==='look'));$('cno').textContent='CASE '+caseNo(seed);$('loc').textContent=C.loc;brief();open('brief')}
$('briefGo').onclick=()=>{shut('brief');toast('Drag to sweep the light. Tap evidence to collect it.')};
$('bDaily').onclick=()=>start('daily-'+today());
$('bRand').onclick=()=>start('case-'+((Math.random()*1e6)|0));
$('bQuit').onclick=()=>{started=false;$('scene').hidden=true;$('title').hidden=false;$('resB').innerHTML='';shut('res');titleInfo()};
$('resAgain').onclick=()=>{shut('res');started=false;$('scene').hidden=true;$('title').hidden=false;titleInfo()};
function titleInfo(){const r=loadRec(),d='daily-'+today(),s=r[d];$('dInfo').textContent=s?'Solved today: '+'★'.repeat(s):'Fresh case every day';}
resizeInit();function resizeInit(){layout();titleInfo();requestAnimationFrame(frame)}
if(/crtest/.test(location.search))window.__cr={get C(){return C},get P(){return P},start,collect,finish,analyze,react,pressure,say,verdict:(s,m,e)=>{pickS=s;pickM=m;pickE=e;verdict()},ending,roomOf,resultOf,tryCollect,render,get pick(){return[pickS,pickM,pickE]}};
})();</script>
